<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Uni𝕏</title>

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D26">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uni𝕏">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="auth-wrap">

  <div class="panel auth-panel">

    <div class="logo-badge">
      <img src="assets/logo.svg" alt="Uni𝕏 logo">
    </div>

    <div
      class="eyebrow"
      style="font-family:'IBM Plex Mono',monospace;color:var(--emerald);font-size:0.75rem;text-transform:uppercase;margin-bottom:8px;text-align:center;"
    >
      Uni𝕏 Account Recovery
    </div>

    <h1 style="text-align:center;">Create a new password</h1>

    <p class="sub" style="text-align:center;">
      Enter and confirm your new password below.
    </p>

    <form id="reset-password-form">

      <div class="field">
        <label for="new-password">New password</label>

        <input
          type="password"
          id="new-password"
          placeholder="At least 6 characters"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>

        <input
          type="password"
          id="confirm-password"
          placeholder="Enter your password again"
          minlength="6"
          required
        >
      </div>

      <div
        class="field error"
        id="password-error"
        style="display:none;"
      ></div>

      <div
        class="field"
        id="password-success"
        style="display:none;color:var(--emerald);"
      ></div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="password-submit"
      >
        Update password
      </button>

    </form>

  </div>

</main>

<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/r2-config.js"></script>
<script type="module" src="js/supabase.js"></script>

<script type="module">

  const form = document.getElementById('reset-password-form');

  const passwordInput =
    document.getElementById('new-password');

  const confirmInput =
    document.getElementById('confirm-password');

  const errorEl =
    document.getElementById('password-error');

  const successEl =
    document.getElementById('password-success');

  const button =
    document.getElementById('password-submit');


  function showError(message) {

    errorEl.textContent = message;
    errorEl.style.display = 'block';

  }


  function hideError() {

    errorEl.style.display = 'none';

  }


  form.addEventListener('submit', async (e) => {

    e.preventDefault();

    hideError();
    successEl.style.display = 'none';

    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;


    if (password.length < 6) {

      showError(
        'Password should be at least 6 characters.'
      );

      return;

    }


    if (password !== confirmPassword) {

      showError(
        'Passwords do not match.'
      );

      return;

    }


    button.disabled = true;
    button.textContent = 'Updating…';


    try {

      await SM.updatePassword(password);

      successEl.textContent =
        'Your password has been updated successfully.';

      successEl.style.display = 'block';

      button.textContent = 'Password updated';


      setTimeout(() => {

        window.location.href = 'login.html';

      }, 2000);


    } catch (err) {

      showError(
        err.message ||
        'Unable to update your password. Please try again.'
      );

      button.disabled = false;
      button.textContent = 'Update password';

    }

  });

</script>

<script src="js/pwa.js"></script>

</body>
</html>
