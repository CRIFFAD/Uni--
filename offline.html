<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline</title>
<link rel="icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D26">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--paper-tint);">
    <div>
      <img src="assets/logo.svg" alt="Summit Hub" style="height:72px; margin-bottom:18px;">
      <h1 style="font-size:1.4rem; margin-bottom:8px;">You're offline</h1>
      <p style="color:var(--text-dim); max-width:320px; margin:0 auto 20px;">This page hasn't been loaded before, so it isn't saved for offline use yet. Reconnect and try again.</p>
      <button onclick="location.reload()" class="btn btn-primary">Retry</button>
    </div>
  </div>
</body>
</html>
