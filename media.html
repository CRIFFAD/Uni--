<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D26">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uni𝕏">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.svg" alt="Uni𝕏 logo" class="unix-mark">Uni<span class="dot">𝕏</span></a>
    <div class="nav-right">
      <div class="navlinks">
        <a href="index.html" class="active">Home</a>
        <a href="news.html">News</a>
        <a href="events.html">Events</a>
        <a href="media.html">Media</a>
        <a href="market.html">Market</a>
      </div>
      <span id="nav-auth-slot" class="auth-slot"></span>
      <button id="install-btn" title="Install Uni𝕏">⬇</button>
    </div>
  </div>
</nav>

<nav class="bottom-tabbar">
  <a href="index.html" class="tab-item active"><span class="tab-icon">🏠</span><span class="tab-label">Home</span></a>
  <a href="news.html" class="tab-item"><span class="tab-icon">📰</span><span class="tab-label">News</span></a>
  <a href="events.html" class="tab-item"><span class="tab-icon">📅</span><span class="tab-label">Events</span></a>
  <a href="media.html" class="tab-item"><span class="tab-icon">📸</span><span class="tab-label">Media</span></a>
  <a href="market.html" class="tab-item"><span class="tab-icon">🛍️</span><span class="tab-label">Market</span></a>
</nav>

<header class="masthead home-hero">
  <div class="wrap">
    <div class="eyebrow">Campus Hub</div>
    <h1>Campus media</h1>
    <p>Photos from events, everyday campus life, and moments worth sharing.</p>
  </div>
</header>

<main class="feed-section">
  <div class="wrap">
    <div class="feed-heading">
      <h2 style="font-size:1.3rem;">Gallery</h2>
      <span class="count" id="result-count"></span>
    </div>
    <div class="media-grid" id="media-grid"></div>
    <div class="empty" id="empty-state" style="display:none;">
      <div class="glyph">📸</div>
      <p>No photos shared yet. Be the first to post one.</p>
    </div>
  </div>
</main>

<!-- <footer>
  <div class="wrap">
    <span>Uni𝕏 — built by a student, for students.</span>
    <span>CRIFIX MEDIA</span>
  </div>
</footer> -->

<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/r2-config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/nav.js"></script>
<script type="module" src="js/notifications.js"></script>
<script type="module">
  renderNav();
  initTopNav();

  SM.listenPosts('media', (posts) => {
    document.getElementById('result-count').textContent = posts.length + (posts.length===1 ? ' photo' : ' photos');
    const grid = document.getElementById('media-grid');
    const empty = document.getElementById('empty-state');
    if (!posts.length){ grid.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display = 'none';
    grid.innerHTML = posts.map(p => `
      <a class="media-tile" href="article.html?id=${p.id}">
        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : '📸'}
        <span class="media-caption">${p.title}</span>
      </a>`).join('');
  });
</script>
<script src="js/pwa.js"></script>
</body>
</html>
