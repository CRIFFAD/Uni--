<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D26">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summit Hub">
<link rel="stylesheet" href="css/style.css">
<style>
  .chat-grid{ position:relative; }
  .thread-item{ animation:thread-in .35s ease both; }
  @keyframes thread-in{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:translateX(0); } }

  .listing-chip{
    align-self:center; display:flex; align-items:center; gap:6px; background:var(--paper-raised);
    border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:0.74rem; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; margin:6px 0; animation:chip-in .3s ease both;
  }
  @keyframes chip-in{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  .listing-chip a{ color:var(--emerald); font-weight:600; }

  .msg{ animation:msg-in .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes msg-in{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .typing-indicator{
    align-self:flex-start; display:flex; align-items:center; gap:4px; padding:10px 14px;
    background:#fff; border:1px solid var(--line); border-radius:14px; border-bottom-left-radius:4px;
    animation:msg-in .2s ease both;
  }
  .typing-indicator .dot{
    width:6px; height:6px; border-radius:50%; background:var(--text-dim); opacity:0.5;
    animation:typing-bounce 1.1s ease-in-out infinite;
  }
  .typing-indicator .dot:nth-child(2){ animation-delay:.15s; }
  .typing-indicator .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes typing-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }

  .conv-input button{ transition:transform .12s ease; }
  .conv-input button:active{ transform:scale(.92); }

  .topnav{ position:fixed; top:0; left:0; right:0; z-index:50; }
  body{ padding-top:var(--nav-h); }

  @media (prefers-reduced-motion: reduce){
    .thread-item, .listing-chip, .msg, .typing-indicator{ animation:none !important; }
  }
</style>
</head>
<body style="--list-display:block; --conv-display:none;">

<nav class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Summit Hub logo">Uni𝕏<span class="dot"></span></a>
    <div class="nav-right">
      <div class="navlinks">
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="events.html">Events</a>
        <a href="media.html">Media</a>
        <a href="market.html" class="active">Market</a>
      </div>
      <span id="nav-auth-slot" class="auth-slot"></span>
      <button id="install-btn" title="Install Summit Hub">⬇</button>
      <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
    <a href="events.html">Events</a>
    <a href="media.html">Media</a>
    <a href="market.html" class="active">Market</a>
    <a href="dashboard.html">My listings</a>
    <a href="profile.html">My profile</a>
  </div>
</nav>

<main class="chat-shell">
  <div class="wrap">
    <h1 style="font-size:1.4rem; margin-bottom:16px; height: 40px;">Messages</h1>
    <div class="chat-grid">
      <div class="thread-list" id="thread-list"></div>
      <div class="conversation" id="conversation">
        <div class="empty" style="margin:auto;">
          <div class="glyph">💬</div>
          <p>Pick a conversation to see messages.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/r2-config.js"></script>
<script type="module" src="js/paystack-config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/nav.js"></script>
<script type="module" src="js/paywall.js"></script>
<script type="module" src="js/notifications.js"></script>
<script type="module">
  renderNav('market');
  initTopNav();

  let user = null;
  let activeThreadId = new URLSearchParams(location.search).get('thread');
  let threadsCache = [];
  let msgUnsub = null;
  let typingHandle = null;
  let typingTimeout = null;
  const otherCache = {};

  SM.onAuthChange((u) => {
    if (!u){ SM.redirectToAuth(); return; }
    user = u;
    if (activeThreadId){
      document.body.style.setProperty('--list-display','none');
      document.body.style.setProperty('--conv-display','flex');
    }
    SM.listenThreads(user.id, async (threads) => {
      threadsCache = threads;
      await renderThreadList();
      if (activeThreadId) openThread(activeThreadId, false);
    });
  });

  function otherIdFor(thread){
    return thread.userAId === user.id ? thread.userBId : thread.userAId;
  }

  async function otherPartyFor(thread){
    const otherId = otherIdFor(thread);
    if (!otherCache[otherId]) otherCache[otherId] = await SM.getUser(otherId);
    return otherCache[otherId];
  }

  async function renderThreadList(){
    const listEl = document.getElementById('thread-list');
    if (!threadsCache.length){
      listEl.innerHTML = `<div class="empty"><div class="glyph">🗂️</div><p style="font-size:0.85rem;">No conversations yet. Message a seller from a listing to start one.</p></div>`;
      return;
    }

    const rows = await Promise.all(threadsCache.map(async (t, i) => {
      const other = await otherPartyFor(t);
      return `
        <div class="thread-item ${t.id===activeThreadId?'active':''}" data-id="${t.id}" style="animation-delay:${i*40}ms;">
          <div class="dot-avatar">${other ? (other.avatarUrl ? `<img src="${other.avatarUrl}" alt="">` : other.initials) : '?'}</div>
          <div class="ti-main">
            <h4>${other ? other.name : 'Unknown'}</h4>
            <div class="ti-listing">${t.contextListingTitle || 'General chat'}</div>
            <div class="ti-last">${t.lastMessage || 'Say hello 👋'}</div>
          </div>
        </div>`;
    }));
    listEl.innerHTML = rows.join('');

    listEl.querySelectorAll('.thread-item').forEach(el => {
      el.addEventListener('click', () => openThread(el.dataset.id, true));
    });
  }

  function openThread(threadId, updateUrl){
    activeThreadId = threadId;
    if (updateUrl) history.replaceState(null, '', `chat.html?thread=${threadId}`);
    document.body.style.setProperty('--list-display','none');
    document.body.style.setProperty('--conv-display','flex');
    renderThreadList();
    renderConversation();
  }

  async function renderConversation(){
    if (msgUnsub){ msgUnsub(); msgUnsub = null; }
    if (typingHandle){ typingHandle.unsubscribe(); typingHandle = null; }
    const convEl = document.getElementById('conversation');
    const thread = threadsCache.find(t => t.id === activeThreadId) || await SM.getThread(activeThreadId);

    if (!thread){
      convEl.innerHTML = `<div class="empty" style="margin:auto;"><div class="glyph">💬</div><p>Pick a conversation to see messages.</p></div>`;
      return;
    }

    const other = await otherPartyFor(thread);

    convEl.innerHTML = `
      <div class="conv-header">
        <button class="back-btn" id="back-btn">←</button>
        <div class="dot-avatar" style="width:32px;height:32px;">${other ? (other.avatarUrl ? `<img src="${other.avatarUrl}" alt="">` : other.initials) : '?'}</div>
        <div>
          <div style="font-weight:600; font-size:0.9rem;">${other ? other.name : 'Unknown'}</div>
          <div style="font-size:0.76rem; color:var(--text-dim);" id="conv-context">${thread.contextListingTitle || 'General chat'}</div>
        </div>
      </div>
      <div class="conv-messages" id="conv-messages"></div>
      <form class="conv-input" id="conv-form">
        <input type="text" id="conv-text" placeholder="Type a message…" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    `;

    document.getElementById('back-btn').addEventListener('click', () => {
      document.body.style.setProperty('--list-display','block');
      document.body.style.setProperty('--conv-display','none');
    });

    let showingTyping = false;
    let latestMessages = [];

    function renderMessages(){
      const msgsEl = document.getElementById('conv-messages');
      if (!msgsEl) return;

      if (!latestMessages.length){
        msgsEl.innerHTML = `<div class="empty" style="margin:auto;"><p style="font-size:0.85rem;">No messages yet — say hello 👋</p></div>`;
      } else {
        let html = '';
        let lastListingId = undefined;
        latestMessages.forEach(m => {
          if (m.listingId && m.listingId !== lastListingId){
            html += `<div class="listing-chip">📦 <a href="listing.html?id=${m.listingId}">${m.listingTitle || 'View listing'}</a></div>`;
          }
          lastListingId = m.listingId || lastListingId;
          html += `
            <div class="msg ${m.from===user.id?'mine':'theirs'}">
              ${m.text}
              <span class="ts">${SM.timeAgo(m.ts)}</span>
            </div>`;
        });
        msgsEl.innerHTML = html;
      }

      if (showingTyping){
        const el = document.createElement('div');
        el.className = 'typing-indicator';
        el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        msgsEl.appendChild(el);
      }
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    msgUnsub = SM.listenMessages(thread.id, (messages) => {
      latestMessages = messages;
      renderMessages();
    });

    typingHandle = SM.listenTyping(thread.id, user.id, () => {
      showingTyping = true;
      renderMessages();
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { showingTyping = false; renderMessages(); }, 2500);
    });

    const textInput = document.getElementById('conv-text');
    let lastTypingSent = 0;
    textInput.addEventListener('input', () => {
      const now = Date.now();
      if (now - lastTypingSent > 1500){
        typingHandle.sendTyping();
        lastTypingSent = now;
      }
    });

    document.getElementById('conv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      await SM.sendMessage(thread.id, user.id, text, thread.contextListingId, thread.contextListingTitle);
    });
  }
</script>
<script src="js/pwa.js"></script>
</body>
</html>
