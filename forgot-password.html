<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Uni𝕏</title>

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D26">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uni𝕏">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="auth-wrap">

  <div class="panel auth-panel">

    <div class="logo-badge">
      <img src="assets/logo.svg" alt="Uni𝕏 logo">
    </div>

    <div
      class="eyebrow"
      style="font-family:'IBM Plex Mono',monospace;color:var(--emerald);font-size:0.75rem;text-transform:uppercase;margin-bottom:8px;text-align:center;"
    >
      Uni𝕏 Account Recovery
    </div>

    <h1 style="text-align:center;">Forgot your password?</h1>

    <p class="sub" style="text-align:center;">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <form id="forgot-password-form">

      <div class="field">
        <label for="reset-email">Email</label>

        <input
          type="email"
          id="reset-email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div
        class="field error"
        id="reset-error"
        style="display:none;"
      ></div>

      <div
        class="field"
        id="reset-success"
        style="display:none;color:var(--emerald);"
      ></div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="reset-submit"
      >
        Send reset link
      </button>

    </form>

    <p style="text-align:center;margin-top:20px;">
      <a
        href="auth.html"
        style="color:var(--emerald);"
      >
        Back to login
      </a>
    </p>

  </div>

</main>

<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/r2-config.js"></script>
<script type="module" src="js/supabase.js"></script>

<script type="module">

  const form = document.getElementById('forgot-password-form');
  const emailInput = document.getElementById('reset-email');

  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');

  const button = document.getElementById('reset-submit');

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  }

  function hideError() {
    errorEl.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {

    e.preventDefault();

    hideError();
    successEl.style.display = 'none';

    const email = emailInput.value.trim();

    button.disabled = true;
    button.textContent = 'Sending…';

    try {

      await SM.sendPasswordReset(email);

      successEl.textContent =
        'Password reset link sent. Please check your email.';

      successEl.style.display = 'block';

      button.textContent = 'Email sent';

    } catch (err) {

      showError(
        err.message || 'Something went wrong. Please try again.'
      );

      button.disabled = false;
      button.textContent = 'Send reset link';

    }

  });

</script>

<script src="js/pwa.js"></script>

</body>
</html>
